<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
    <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: #0a0a0a;
    color: white;
    padding: 2rem 1rem;
  }

  /* Main container */
  .app {
    max-width: 1000px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .header h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #f9d71c, #e94560);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header p {
    color: #666;
    font-size: 0.95rem;
  }

  /* Search bar */
  .search-area {
    display: flex;
    gap: 0.75rem;
    max-width: 600px;
    margin: 0 auto 2.5rem;
  }

  .search-input {
    flex: 1;
    padding: 0.9rem 1.2rem;
    border: 1.5px solid #2a2a2a;
    border-radius: 14px;
    background: #161616;
    color: white;
    font-family: 'Segoe UI', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus { border-color: #e94560; }
  .search-input::placeholder { color: #444; }

  .search-btn {
    background: #e94560;
    color: white;
    border: none;
    border-radius: 14px;
    padding: 0.9rem 1.75rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }

  .search-btn:hover  { opacity: 0.85; }
  .search-btn:active { transform: scale(0.97); }

  /* Loading and error */
  .loading, .error {
    text-align: center;
    color: #666;
    padding: 2rem;
    display: none;
  }

  .error { color: #e94560; }

  /* Movies grid */
  .movies-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.5rem;
  }

  /* Individual movie card */
  .movie-card {
    background: #161616;
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
    animation: slideIn 0.3s ease;
  }

  .movie-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Movie poster */
  .movie-poster {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    display: block;
    background: #2a2a2a;
  }

  /* Placeholder when no poster available */
  .no-poster {
    width: 100%;
    aspect-ratio: 2/3;
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }

  /* Movie info area */
  .movie-info {
    padding: 1rem;
  }

  .movie-title {
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
    line-height: 1.3;
    /* Truncate long titles */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .movie-year {
    font-size: 0.78rem;
    color: #666;
  }

  .movie-type {
    display: inline-block;
    background: #e94560;
    color: white;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 100px;
    text-transform: capitalize;
    margin-top: 0.4rem;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
    color: #444;
  }

  .empty-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
  }

  /* Mobile */
  @media (max-width: 480px) {
    .movies-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>

<body>
    <div class="app">

        <!--Header-->
        <div class="app-header">
            <h1>🎬 Movie Search</h1>
            <p>Search for any movie, series or documentary</p>
        </div>

        <!--Search bar-->
        <div class="search-area">
            <input type="text" class="search-input" id="searchInput" placeholder="Type a movie name..."/>
            <button class="search-btn" id="searchBtn">Search</button>
        </div>

        <!--Loading -->
        <div class="loading" id="loading">Searching Moviess...</div>
        
        <!--Error-->
        <div class="error" id="error">Error: Movie not found. Try another search!</div>

        <!--Movie grid-->
        <div class="movies-grid" id="moviesGrid"></div>

        <!-- Empty State-->
        <div class="empty-state" id="emptyState">
        <div class="empty-icon">🎥</div>
            <p>Start by searching for a movie above to get started!</p>
        </div>
    </div>
<script>
  // ============================================================
  // 1. YOUR API KEY — paste yours between the quotes
  // ============================================================
  var API_KEY = '95894a72';

  // ============================================================
  // 2. GRAB ELEMENTS
  // ============================================================
  var searchInput = document.getElementById('searchInput');
  var searchBtn   = document.getElementById('searchBtn');
  var moviesGrid  = document.getElementById('moviesGrid');
  var loading     = document.getElementById('loading');
  var error       = document.getElementById('error');
  var emptyState  = document.getElementById('emptyState');

  // ============================================================
  // 3. SEARCH MOVIES
  // Fetches results from the OMDB API using the search query
  // ============================================================
  async function searchMovies() {
    var query = searchInput.value.trim();

    // Don't search if input is empty
    if (!query) return;

    // Show loading, hide everything else
    loading.style.display    = 'block';
    error.style.display      = 'none';
    emptyState.style.display = 'none';
    moviesGrid.innerHTML     = '';

    try {
      // Build the API URL with the search query and API key
      var url = 'https://www.omdbapi.com/?s=' + query + '&apikey=' + API_KEY;
      var response = await fetch(url);
      var data     = await response.json();

      loading.style.display = 'none';

      // OMDB returns Response: "True" if results found
      if (data.Response === 'True') {
        displayMovies(data.Search);
      } else {
        error.style.display = 'block';
      }

    } catch (err) {
      loading.style.display = 'none';
      error.style.display   = 'block';
    }
  }

  // ============================================================
  // 4. DISPLAY MOVIES
  // Loops through results and creates a card for each movie
  // ============================================================
  function displayMovies(movies) {
    moviesGrid.innerHTML = '';

    movies.forEach(function(movie) {
      var card = document.createElement('div');
      card.className = 'movie-card';

      // Check if a poster exists or show a placeholder
      var posterHTML = movie.Poster !== 'N/A'
        ? '<img class="movie-poster" src="' + movie.Poster + '" alt="' + movie.Title + '" />'
        : '<div class="no-poster">🎬</div>';

      card.innerHTML =
        posterHTML +
        '<div class="movie-info">' +
          '<div class="movie-title">' + movie.Title + '</div>' +
          '<div class="movie-year">' + movie.Year + '</div>' +
          '<span class="movie-type">' + movie.Type + '</span>' +
        '</div>';

      moviesGrid.appendChild(card);
    });
  }

  // ============================================================
  // 5. EVENT LISTENERS
  // ============================================================

  // Click search button
  searchBtn.addEventListener('click', searchMovies);

  // Press Enter in input
  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') searchMovies();
  });

  // ============================================================
  // 6. SHOW EMPTY STATE ON LOAD
  // ============================================================
  emptyState.style.display = 'block';

</script>
</body>
</html>
